<style>
/* Layout: uma tela por vez (Times, Jogo, Resumo), barra de abas fixa embaixo, placar grande no centro do Jogo. Mesma identidade do sorteio (marrom, dourado). */
:root{
  --bg:#1b0f08; --surface:#2c1a10; --surface-2:#3a2417; --fg:#fbf3e6; --muted:#d9c5ab; --line:rgba(243,232,216,.26);
  --accent:#e0b366; --accent-fg:#1b0f08; --accent-soft:#4a3219;
  --ok:#9fcf8e; --ok-bg:#25371f; --warn:#f5cb7a; --warn-bg:#4a3512; --bad:#ffb0a0; --bad-bg:#5a2218;
  --branco-bg:#efe6d6; --branco-fg:#241309;
  --azul-bg:#6d94ff; --azul-fg:#04102b;
  --marrom-bg:#9c4527; --marrom-fg:#ffffff;
  --amarelo-bg:#e6c447; --amarelo-fg:#2a1d00;
  --head-a:#4a2113; --head-b:#6b2f16; --head-fg:#fbf3e6;
  --display:'Fraunces',Georgia,serif; --body:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f5efe6; --surface:#fffdf9; --surface-2:#efe6d8; --fg:#2a170c; --muted:#6b5340; --line:rgba(60,35,15,.22);
  --accent:#8a5410; --accent-fg:#ffffff; --accent-soft:#f1e2c6;
  --ok:#2d6a1f; --ok-bg:#e1f0d9; --warn:#7a4b00; --warn-bg:#fbebc6; --bad:#8f2412; --bad-bg:#fbdcd5;
  color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#f5efe6; --surface:#fffdf9; --surface-2:#efe6d8; --fg:#2a170c; --muted:#6b5340; --line:rgba(60,35,15,.22);
  --accent:#8a5410; --accent-fg:#ffffff; --accent-soft:#f1e2c6;
  --ok:#2d6a1f; --ok-bg:#e1f0d9; --warn:#7a4b00; --warn-bg:#fbebc6; --bad:#8f2412; --bad-bg:#fbdcd5;
  color-scheme:light;}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 170px;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.05;text-wrap:balance}
h2{font-size:21px}
button{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=date],input[type=number],input[type=password],input[type=url],select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;max-width:100%}
@media(max-width:860px){input,select{font-size:16px}}
.btn-primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn-primary:hover{filter:brightness(1.06);border-color:var(--accent)}
.btn-ghost{background:transparent}
.hint{color:var(--muted);font-size:14px}
.wrap{max-width:760px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px calc(50vw - 50% + 16px);margin:0 calc(50% - 50vw) 16px;background:linear-gradient(120deg,var(--head-a),var(--head-b));color:var(--head-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head-a);z-index:31}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none}
.brand h1{font-size:22px;color:var(--head-fg)}
.brand small{display:block;color:#ecd3ba;font-size:13px}
.hb{display:flex;gap:8px;flex:none}
.hb button{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.25);color:var(--head-fg);min-width:44px;padding:6px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.row>*{min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;min-width:48px;background:var(--surface)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg);font-weight:700}
textarea{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:130px;resize:vertical}
@media(max-width:860px){textarea{font-size:16px}}
details>summary{cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center;gap:8px;font-weight:600}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:'▸';color:var(--accent);transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
/* times */
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.team{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);min-width:0}
.th{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;font-family:var(--display);font-weight:700;font-size:22px}
.c-branco{background:var(--branco-bg);color:var(--branco-fg)}
.c-azul{background:var(--azul-bg);color:var(--azul-fg)}
.c-marrom{background:var(--marrom-bg);color:var(--marrom-fg)}
.c-amarelo{background:var(--amarelo-bg);color:var(--amarelo-fg)}
.plist{list-style:none;margin:0;padding:4px 0}
.plist li{padding:0 8px;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.pl{display:flex;align-items:center;gap:8px;min-height:46px}
.pn{flex:1 1 auto;text-align:left;border:0;background:transparent;padding:6px 4px;overflow-wrap:anywhere}
.tag{min-width:44px;min-height:34px;padding:0 8px;font-size:13px;font-weight:700;color:var(--muted)}
.tag.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pact{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 8px}
.pact button{min-height:38px;font-size:14px}
.addp{margin:8px;width:calc(100% - 16px)}
.none{padding:10px 12px;color:var(--muted);font-size:14px}
.gkrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.gkrow select{max-width:130px}
.gkrow:last-of-type{border-bottom:0}
.gkrow b{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.gkrow button{flex:none;min-width:44px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14.5px;margin-bottom:12px}
.badbox{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:14.5px;margin-bottom:12px}
.okbox{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:10px 12px;font-size:14.5px;margin-bottom:12px}
/* jogo */
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px;scrollbar-width:thin}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:52px;min-height:52px;padding:6px 8px;border-radius:10px}
.chip b{font-variant-numeric:tabular-nums;font-size:15px}
.chip i{display:flex;gap:3px}
.chip i u{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);display:block}
.chip.cur{border:2px solid var(--accent);background:var(--accent-soft)}
.chip.done{opacity:.8}
.chip.done b::after{content:' ✓';color:var(--ok)}
.u-branco{background:var(--branco-bg)}.u-azul{background:var(--azul-bg)}.u-marrom{background:var(--marrom-bg)}.u-amarelo{background:var(--amarelo-bg)}
.gh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.gh h2{font-size:26px}
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:12px}
.side{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.side .sh{padding:8px 10px;font-family:var(--display);font-weight:700;font-size:20px;text-align:center}
.side .sc{font-family:var(--display);font-weight:900;font-size:clamp(64px,22vw,104px);line-height:1;text-align:center;padding:10px 0 6px;font-variant-numeric:tabular-nums}
.side .gol{margin:4px 10px 8px;min-height:60px;font-size:20px;font-weight:700;background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.side .sub{display:flex;gap:6px;padding:0 10px 10px}
.side .sub button{min-height:44px;font-size:14px}
.side .sub .minus{flex:none;min-width:48px;font-size:20px;font-weight:700}
.side .sub .gkb{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log{display:grid;gap:6px;margin-bottom:14px}
.ev{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:50px;padding:8px 12px}
.ev .sc2{font-variant-numeric:tabular-nums;font-weight:700;min-width:44px;color:var(--muted)}
.ev .dot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid var(--line)}
.ev .tx{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.ev .tx small{display:block;color:var(--muted);font-size:13.5px}
.ev.pend{background:var(--warn-bg);border-color:var(--warn)}
.ev.pend .tx small{color:var(--warn)}
.actbar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:20;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.actbar .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.actbar button{flex:1 1 auto;min-height:56px;font-size:18px;font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{border:0;border-radius:0;min-height:60px;background:transparent;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px}
.tabs button[aria-current=page]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.tabs .bd{font-size:12px;background:var(--warn-bg);color:var(--warn);border-radius:99px;padding:0 7px;font-weight:700}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:760px;max-height:88%;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h2{margin-bottom:4px}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:12px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
@media(min-width:560px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pgrid button{min-height:58px;font-size:17px;font-weight:600;overflow-wrap:anywhere;position:relative}
.pgrid button small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.pgrid button.alt{background:var(--surface-2)}
.sheet .foot{display:flex;flex-wrap:wrap;gap:8px}
.sheet .foot button{flex:1 1 140px}
.plist2{display:grid;gap:6px;margin:10px 0;max-height:46vh;overflow-y:auto}
.plist2 button{display:flex;justify-content:space-between;align-items:center;text-align:left;min-height:48px}
.plist2 button span{color:var(--muted);font-size:13px}
/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;max-width:min(92vw,520px);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.toast button{min-height:36px;padding:4px 10px;background:transparent;color:var(--bg);border-color:var(--bg);font-weight:700}
/* resumo */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);font-size:14.5px;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.dot2 span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid var(--line)}
@media(max-width:480px){th,td{padding:7px 4px;font-size:13.5px}th{font-size:11.5px;letter-spacing:.03em}}
tr.sep td{background:var(--surface-2);font-family:var(--display);font-weight:700;text-align:left}
.adj{display:grid;gap:8px;margin-top:8px}
.adjr{display:grid;grid-template-columns:minmax(0,1.2fr) repeat(2,auto);gap:6px 10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px}
.adjr b{min-width:0;overflow-wrap:anywhere}
.step{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted)}
.step div{display:flex;align-items:center;gap:4px}
.step button{min-width:36px;min-height:36px;padding:0}
.step output{min-width:22px;text-align:center;color:var(--fg);font-weight:700;font-size:15px}
.cfg label{display:grid;gap:4px;margin-bottom:10px;font-size:14px;color:var(--muted)}
.cfg input{width:100%}
pre.out{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:12.5px;max-height:220px;margin:8px 0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

(function(){
'use strict';
const ROSTER=[{"n": "Maicon", "p": "A"}, {"n": "Nuan", "p": "A"}, {"n": "Adriano", "p": "A"}, {"n": "Leandro", "p": "A"}, {"n": "Chico", "p": "A"}, {"n": "Carioca", "p": "A"}, {"n": "Dioguinho", "p": "A"}, {"n": "Beck", "p": "A"}, {"n": "Bruno F", "p": "A"}, {"n": "Juan", "p": "A"}, {"n": "Julio", "p": "A"}, {"n": "Cauã", "p": "A"}, {"n": "Ed", "p": "A"}, {"n": "Lebre", "p": "A"}, {"n": "Thomas", "p": "G"}, {"n": "Kauê", "p": "G"}, {"n": "Venilson", "p": "G"}, {"n": "André Bigode", "p": "G"}, {"n": "Nabor", "p": "G"}, {"n": "Arcanjo", "p": "G"}, {"n": "Sansão", "p": "G"}, {"n": "Iury", "p": "G"}, {"n": "Thiago GK", "p": "G"}, {"n": "GK Aluguel", "p": "G"}, {"n": "Gabriel", "p": "G"}, {"n": "Fabio", "p": "M"}, {"n": "Berg", "p": "M"}, {"n": "Diego", "p": "M"}, {"n": "Fil", "p": "M"}, {"n": "Elton", "p": "M"}, {"n": "Presidente Fernando", "p": "M"}, {"n": "Cris", "p": "M"}, {"n": "Predador", "p": "M"}, {"n": "Alexandre", "p": "M"}, {"n": "Elias", "p": "M"}, {"n": "Pety", "p": "M"}, {"n": "Emerson", "p": "M"}, {"n": "Soteldo", "p": "M"}, {"n": "Thiago Benato", "p": "M"}, {"n": "Will", "p": "M"}, {"n": "Café", "p": "M"}, {"n": "Simon", "p": "M"}, {"n": "Well", "p": "M"}, {"n": "Gustavo", "p": "M"}, {"n": "Will Prince", "p": "M"}, {"n": "Fernando", "p": "M"}, {"n": "Gilmar", "p": "M"}, {"n": "Giovani", "p": "M"}, {"n": "Carlos", "p": "M"}, {"n": "Che", "p": "M"}, {"n": "Diego Alves", "p": "M"}, {"n": "Felipe", "p": "M"}, {"n": "Giovanni", "p": "M"}, {"n": "Nelian", "p": "M"}, {"n": "Rafael", "p": "M"}, {"n": "Eliel", "p": "Z"}, {"n": "Gepeto", "p": "Z"}, {"n": "William", "p": "Z"}, {"n": "Mathias", "p": "Z"}, {"n": "GK", "p": "Z"}, {"n": "Wash", "p": "Z"}, {"n": "Pó", "p": "Z"}, {"n": "Pedrão", "p": "Z"}, {"n": "David", "p": "Z"}, {"n": "Cleiton", "p": "Z"}, {"n": "Fernando T", "p": "Z"}, {"n": "Pedro", "p": "Z"}, {"n": "Cesar", "p": "Z"}, {"n": "Eloi", "p": "Z"}, {"n": "Felipe garcia", "p": "Z"}, {"n": "Gerson", "p": "Z"}, {"n": "Gringo", "p": "Z"}, {"n": "Jose", "p": " const TEAMS=[
  {k:'branco',n:'Branco',e:'⚪',sheet:'Branco'},
  {k:'azul',n:'Azul',e:'🔵',sheet:'Azul'},
  {k:'marrom',n:'Marrom',e:'🟤',sheet:'Preto'},
  {k:'amarelo',n:'Amarelo',e:'🟡',sheet:'Amarelo'}];
const TK={}; TEAMS.forEach(t=>TK[t.k]=t); TK.preto=TK.marrom;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const BYN={}; ROSTER.forEach(r=>BYN[norm(r.n)]=r);
const canon=n=>{const t=String(n||'').trim().replace(/\s+/g,' '); const r=BYN[norm(t)]; return r?r.n:t;};
const LS='sumula-am-v1', CFGK='sumula-am-cfg-v1';
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

/* ---------- estado ---------- */
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fresh(){return {v:1,date:todayISO(),nt:3,total:9,teams:mkTeams(3),gks:[],games:[],order:null,extras:{},absent:[],tab:'times',cur:0,sent:null};}
function mkTeams(n){return TEAMS.slice(0,n).map(t=>({c:t.k,players:[]}));}
let S=lsGet(LS); if(!S||S.v!==1) S=fresh(); if(!S.absent) S.absent=[];
let ui={sheet:null,row:null,send:null,idToken:null,toast:null,pickMsg:''};
const undo=[];
function save(){lsSet(LS,S);}
function commit(fn){undo.push(JSON.stringify(S)); if(undo.length>60) undo.shift(); fn(); syncGames(); save(); render();}
function doUndo(){ if(!undo.length) return; S=JSON.parse(undo.pop()); ui.sheet=null; save(); render(); }
const T=i=>TK[S.teams[i].c];
const rnd=n=>{const a=new Uint32Array(1); (window.crypto||{getRandomValues:x=>{x[0]=Math.random()*4294967296;}}).getRandomValues(a); return a[0]%n;};

/* ---------- motor ---------- */
const score=g=>{let a=0,b=0; g.goals.forEach(x=>x.s===0?a++:b++); return [a,b];};
const pending=g=>g.goals.map((x,i)=>({x,i})).filter(o=>o.x.by===null||(o.x.by!=='*'&&o.x.as===null));
function newGame(a,b){return {a,b,gk:[null,null],gkAuto:false,goals:[],done:false};}
function setOrder(first,second){const n=S.teams.length; const rest=[]; for(let i=0;i<n;i++) if(i!==first&&i!==second) rest.push(i); S.order=[first,second].concat(rest);}
function pairAt(i){
  const n=S.teams.length, o=S.order||[0,1,2,3].slice(0,n);
  if(n===2) return [0,1];
  if(n===3){const [X,Y,Z]=o; return [[X,Y],[X,Z],[Y,Z],[Y,X],[Z,X],[Z,Y]][i%6];}
  const P=[[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]][i%6]; return [o[P[0]],o[P[1]]];
}
function syncGames(){
  if(!S.games.length) return;
  const n=S.teams.length;
  const known=n!==3||(S.games[0].done&&S.order);
  const want=known?S.total:1;
  while(S.games.length<want){const p=pairAt(S.games.length); S.games.push(newGame(p[0],p[1]));}
  while(S.games.length>want){const g=S.games[S.games.length-1]; if(g.done||g.goals.length) break; S.games.pop();}
  if(S.cur>=S.games.length) S.cur=S.games.length-1;
}
function gkCount(name){let c=0; S.games.forEach(g=>{if(g.done&&(g.gk[0]===name||g.gk[1]===name)) c++;}); return c;}
function autoGk(g){
  const chosen=[null,null];
  for(let s=0;s<2;s++){
    const ti=s?g.b:g.a, other=chosen[1-s];
    let c=S.gks.filter(x=>x.t===ti&&x.n!==other).map(x=>x.n);
    if(!c.length) c=S.gks.filter(x=>x.n!==other&&(x.t===null||x.t===undefined||x.t===ti)).map(x=>x.n).sort((p,q)=>gkCount(p)-gkCount(q));
    if(!c.length) c=S.gks.filter(x=>x.n!==other).map(x=>x.n).sort((p,q)=>gkCount(p)-gkCount(q));
    chosen[s]=c[0]||null;
  }
  g.gk=chosen; g.gkAuto=true;
}
function sidePlayers(g,s){const t=S.teams[s?g.b:g.a]; const l=t.players.map(p=>p.n); if(g.gk[s]&&l.indexOf(g.gk[s])<0) l.push(g.gk[s]); return l;}
function goalStats(){const m={}; S.games.forEach(g=>{ if(!g.done) return; g.goals.forEach(x=>{ if(x.by&&x.by!=='*'){(m[x.by]=m[x.by]||{g:0,a:0}).g++;} if(x.as){(m[x.as]=m[x.as]||{g:0,a:0}).a++;} }); }); return m;}
function liveGoalCount(name){let c=0; S.games.forEach(g=>g.goals.forEach(x=>{if(x.by===name) c++;})); return c;}
function teamTable(){
  const R=S.teams.map(()=>({gp:0,v:0,e:0,d:0,gf:0,gc:0,cs:0}));
  S.games.forEach(g=>{ if(!g.done) return; const [a,b]=score(g); const A=R[g.a],B=R[g.b];
    A.gp++;B.gp++;A.gf+=a;A.gc+=b;B.gf+=b;B.gc+=a; if(b===0)A.cs++; if(a===0)B.cs++;
    if(a>b){A.v++;B.d++;} else if(b>a){B.v++;A.d++;} else {A.e++;B.e++;} });
  return R;
}
const ex=n=>Object.assign({assid:2,falta:0,bonus:0},S.extras[n]||{});
function compute(){
  const R=teamTable(), st=goalStats(), rows=[];
  S.teams.forEach((t,i)=>{
    const sorted=t.players.slice().sort((p,q)=>(q.zc?1:0)-(p.zc?1:0));
    sorted.forEach(p=>{const x=ex(p.n),s=st[p.n]||{g:0,a:0};
      rows.push({team:i,time:TK[t.c].sheet,nome:p.n,gols:s.g,ass:s.a,vit:R[i].v,emp:R[i].e,assid:x.assid,falta:x.falta,zsg:p.zc?R[i].cs:null,bonus:x.bonus,gs:null,pos:p.zc?'ZC':'',gk:false});});
  });
  S.gks.forEach(k=>{
    let v=0,e=0,gs=0,gp=0;
    S.games.forEach(g=>{ if(!g.done) return; [0,1].forEach(s=>{ if(g.gk[s]!==k.n) return; const sc=score(g); const f=sc[s],c=sc[1-s]; gp++; gs+=c; if(f>c)v++; else if(f===c)e++; }); });
    const x=ex(k.n),s=st[k.n]||{g:0,a:0};
    if(gp||s.g||s.a) rows.push({team:-1,time:'Goleiro',nome:k.n,gols:s.g,ass:s.a,vit:v,emp:e,assid:x.assid,falta:x.falta,zsg:null,bonus:x.bonus,gs:gs,pos:'Goleiro',gk:true,jogos:gp});
  });
  S.absent.forEach(n=>{rows.push({team:-2,time:'Faltou',nome:n,gols:0,ass:0,vit:0,emp:0,assid:-5,falta:0,bonus:0,zsg:null,gs:null,pos:'',gk:false,ausente:true});});
  rows.forEach(r=>{const w=r.gk?2:3; r.total=r.vit*w+r.gols+r.ass+r.emp+r.assid-r.falta*2+(r.zsg||0)+r.bonus*5; r.base=r.vit*w+r.emp+r.assid+(r.zsg||0)-r.falta*2;});
  return rows;
}
function problems(){
  const out=[], bad=[];
  const seen={}; S.teams.forEach(t=>t.players.forEach(p=>{seen[p.n]=(seen[p.n]||0)+1;})); S.gks.forEach(k=>{seen[k.n]=(seen[k.n]||0)+1;}); S.absent.forEach(n=>{seen[n]=(seen[n]||0)+1;});
  Object.keys(seen).forEach(n=>{if(seen[n]>1) bad.push(n+' aparece mais de uma vez nos times/goleiros');});
  S.games.forEach((g,i)=>{ if(!g.done) out.push('Jogo '+(i+1)+' não foi encerrado'); const p=pending(g); if(p.length) out.push('Jogo '+(i+1)+': '+p.length+' gol(s) sem autor ou assistência definidos'); });
  return {warn:out,bad:bad};
}
function buildPayload(){
  const rows=compute();
  const cfg=lsGet(CFGK)||{};
  const jogos=[],lances=[],gks=[];
  S.games.forEach((g,i)=>{ if(!g.done) return; const [a,b]=score(g); const A=TK[S.teams[g.a].c].sheet,B=TK[S.teams[g.b].c].sheet;
    jogos.push({n:i+1,timeA:A,golsA:a,golsB:b,timeB:B});
    gks.push({n:i+1,timeA:A,gkA:g.gk[0]||'',timeB:B,gkB:g.gk[1]||''});
    let pa=0,pb=0; g.goals.forEach((x,k)=>{ x.s===0?pa++:pb++; lances.push({jogo:i+1,ordem:k+1,time:x.s===0?A:B,autor:x.by==='*'?'':x.by,assist:x.as||'',placar:pa+'-'+pb}); }); });
  return {action:'append',date:S.date,jogos:jogos,atletas:rows.map(r=>({time:r.time,nome:r.nome,gols:r.gols,ass:r.ass,vit:r.vit,emp:r.emp,assid:r.assid,falta:r.falta,bonus:r.bonus,gs:r.gs,pos:r.pos,ausente:!!r.ausente})),lances:lances,goleiros:gks,app:'sumula-am-1'};
}
/* leitura do texto do sorteio ("Copiar texto") */
function parseSorteio(txt){
  const teams=[]; let cur=null;
  String(txt||'').split(/\r?\n/).forEach(raw=>{
    const l=raw.trim(); if(!l) return;
    if(/^🧤/.test(l)){ if(cur) l.replace(/^🧤\s*/,'').split('/').forEach(n=>{n=canon(n); if(n) cur.gks.push(n);}); return; }
    const b=l.match(/^[•\-*·]\s*(.+?)\s*(?:\(([ZMAGzmag])\))?\s*$/);
    if(b){ if(cur) cur.players.push({n:canon(b[1]),zc:(b[2]||'').toUpperCase()==='Z'}); return; }
    const h=l.match(/\b(BRANCO|AZUL|MARROM|PRETO|AMARELO)\b/i);
    if(h && !/Sorteio/i.test(l)){ cur={c:TK[h[1].toLowerCase()].k,players:[],gks:[]}; teams.push(cur); }
  });
  return teams.filter(t=>t.players.length||t.gks.length);
}

const SORT='am-sorteio-atual';
function applyTeams(t,gkTeam){
  if(S.games.length){showToast('Já existe um dia em andamento. Use “Novo dia” em ⚙ para trazer outros times.'); return;}
  commit(()=>{ S.teams=t.slice(0,4).map(x=>({c:x.c,players:x.players})); S.nt=S.teams.length; S.gks=[]; S.absent=[]; t.slice(0,4).forEach((x,i)=>x.gks.forEach(n=>{ if(!S.gks.some(k=>k.n===n)) S.gks.push({n:n,t:(gkTeam&&gkTeam[n]!==undefined)?gkTeam[n]:i}); })); });
  showToast(S.teams.length+' times lidos');
}
/* ---------- ações ---------- */
function startDay(){
  const n=S.teams.length;
  commit(()=>{
    S.total={2:6,3:9,4:6}[n]; S.cur=0; S.sent=null;
    let o=[...Array(n).keys()];
    for(let i=o.length-1;i>0;i--){const j=rnd(i+1); [o[i],o[j]]=[o[j],o[i]];}
    if(n===2) o=[0,1];
    S.order=o; const p=pairAt(0); S.games=[newGame(p[0],p[1])]; S.tab='jogo';
  });
}
function addGoal(s){
  const g=S.games[S.cur]; if(!g||g.done) return;
  commit(()=>{g.goals.push({s:s,by:null,as:null}); ui.sheet={type:'by',gi:S.cur,k:g.goals.length-1};});
}
function removeLastGoal(s){
  const g=S.games[S.cur]; if(!g||g.done) return;
  let k=-1; for(let i=g.goals.length-1;i>=0;i--){ if(g.goals[i].s===s&&(g.goals[i].by===null)){k=i;break;} }
  if(k<0) for(let i=g.goals.length-1;i>=0;i--){ if(g.goals[i].s===s){k=i;break;} }
  if(k<0) return;
  commit(()=>{g.goals.splice(k,1);}); showToast('Gol removido',{label:'Desfazer',fn:doUndo});
}
function pickBy(name){
  const sh=ui.sheet, g=S.games[sh.gi], x=g.goals[sh.k];
  commit(()=>{ x.by=name; if(name==='*'){x.as='';ui.sheet=null;} else {x.as=null; ui.sheet={type:'as',gi:sh.gi,k:sh.k};} });
  nextPendingAfter();
}
function pickAs(name){
  const sh=ui.sheet, g=S.games[sh.gi], x=g.goals[sh.k];
  commit(()=>{x.as=name; ui.sheet=null;});
}
function nextPendingAfter(){}
function finishGame(){
  const g=S.games[S.cur]; if(!g||g.done) return;
  if(pending(g).length){ ui.sheet={type:'pend'}; render(); return; }
  const num=S.cur+1;
  commit(()=>{ g.done=true; afterDone(); });
  if(!ui.sheet) showToast('Jogo '+num+' encerrado',{label:'Desfazer',fn:doUndo});
}
function afterDone(){
  const g=S.games[S.cur];
  if(S.teams.length===3&&S.cur===0){ const [a,b]=score(g); if(a===b){ ui.sheet={type:'stay'}; return; } if(a>b) setOrder(g.a,g.b); else setOrder(g.b,g.a); syncGames(); }
  advance();
}
function advance(){
  let nx=-1; for(let i=S.cur+1;i<S.games.length;i++) if(!S.games[i].done){nx=i;break;}
  if(nx<0) for(let i=0;i<S.games.length;i++) if(!S.games[i].done){nx=i;break;}
  if(nx<0){S.tab='resumo'; return;}
  S.cur=nx;
}
function reopen(i){ commit(()=>{S.games[i].done=false; S.cur=i; S.sent=null; if(i===0&&S.teams.length===3){ while(S.games.length>1){const g=S.games[S.games.length-1]; if(g.done||g.goals.length) break; S.games.pop();} }}); }

function fillPick(q){
  const sh=ui.sheet; if(!sh||sh.type!=='pick') return;
  const used=new Set(); S.teams.forEach(t=>t.players.forEach(p=>used.add(p.n))); S.gks.forEach(k=>used.add(k.n)); S.absent.forEach(n=>used.add(n));
  q=norm(q||($('#pq')?$('#pq').value:''));
  let list=ROSTER.filter(r=>!used.has(r.n)&&(!q||norm(r.n).indexOf(q)>=0));
  if(sh.t==='gk') list.sort((a,b)=>(b.p==='G')-(a.p==='G')||a.n.localeCompare(b.n,'pt')); else list=list.filter(r=>r.p!=='G').concat(list.filter(r=>r.p==='G')).sort((a,b)=>(a.p==='G')-(b.p==='G')||a.n.localeCompare(b.n,'pt'));
  const exact=ROSTER.some(r=>norm(r.n)===q);
  const nm=$('#pq')?$('#pq').value.trim():'';
  $('#pl').innerHTML=list.map(r=>'<button data-act="padd" data-n="'+esc(r.n)+'">'+esc(r.n)+'<span>'+({Z:'zagueiro',M:'meia',A:'atacante',G:'goleiro'}[r.p]||'')+'</span></button>').join('')+(nm&&!exact?'<button data-act="padd" data-n="'+esc(nm)+'" class="btn-primary">Adicionar “'+esc(nm)+'” como atleta novo</button>':'');
}
function addPick(name){
  const sh=ui.sheet; name=canon(name); if(!name) return;
  commit(()=>{
    if(sh.t==='gk'){ S.gks.push({n:name,t:null}); }
    else if(sh.t==='abs'){ S.absent.push(name); }
    else { const r=BYN[norm(name)]; S.teams[sh.t].players.push({n:name,zc:!!(r&&r.p==='Z')}); }
  });
  ui.pickMsg='Adicionado: '+name; const m=$('#pickMsg'); if(m) m.textContent=ui.pickMsg;

  render(); const q2=$('#pq'); if(q2) q2.focus();
}

const fmtDate=iso=>dtxt(iso);
function tsv26(r0){
  const rows=compute(); const lines=[]; let r=r0?+r0:0, lastT=null;
  rows.forEach((x,i)=>{ const rr=r?r+i:0; const first=i===0, nt=x.time!==lastT; lastT=x.time;
    const f=(s)=>rr?s.replace(/\{r\}/g,rr).replace(/\{p\}/g,rr-1):'';
    const bl=x.ausente; lines.push([first?fmtDate(S.date):'',f('=IF(A{r}="",B{p},A{r})'),nt?x.time:'',f('=IF(C{r}="",D{p},C{r})'),x.nome,bl?'':x.gols,bl?'':x.ass,bl?'':x.vit,bl?'':x.emp,x.assid,x.falta||'',
      rr?f('=IF(P{r}="ZC", SUMPRODUCT((Jogos!$B$2:$B996=B{r})*(Jogos!$D$2:$D996=D{r})*(Jogos!$F$2:$F996=0)*(Jogos!$F$2:$F996<>"")) + SUMPRODUCT((Jogos!$B$2:$B996=B{r})*(Jogos!$G$2:$G996=D{r})*(Jogos!$E$2:$E996=0)*(Jogos!$E$2:$E996<>"")), "")'):(x.zsg===null?'':x.zsg),
      x.bonus||'',x.gs===null?'':x.gs,
      rr?f('=IF(B{r}="","",IF(P{r}="Goleiro",H{r}*2,H{r}*3)+SUM(F{r},G{r},I{r},J{r})-K{r}*2+L{r}+M{r}*5)'):'',x.pos,
      rr?f('=IF(B{r}="","",IF(P{r}="Goleiro",H{r}*2,H{r}*3)+SUM(I{r}:J{r},L{r})-K{r}*2)'):''].join('\t')); });

async function getToken(cfg){
  if(!cfg.clientId) return null;
  const t=ui.idToken; if(!t) throw new Error('Entre com sua conta Google em ⚙ antes de enviar.');
  try{const p=JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); if(p.exp*1000<Date.now()+30000){ui.idToken=null; throw new Error('O login do Google expirou. Entre de novo em ⚙.');}}catch(e){ if(/Google/.test(e.message)) throw e; }
  return t;
}
async function send(replace){
  const cfg=lsGet(CFGK)||{};
  if(!cfg.url){ ui.sheet={type:'cfg'}; render(); return; }
  ui.send={state:'sending'}; render();
  try{
    const pl=buildPayload(); pl.replace=!!replace; const tok=await getToken(cfg); if(tok) pl.idToken=tok; else pl.key=cfg.key||'';
    const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(pl)});
    const j=await r.json();
    if(j.ok){ const w=j.written||{}; const msg=(w.atletas||0)+' atletas, '+(w.jogos||0)+' jogos, '+(w.lances||0)+' gols.'; S.sent={at:new Date().toLocaleString('pt-BR'),msg:msg}; save(); ui.send=null; showToast('Planilha atualizada'); }
    else if(j.code==='DATE_EXISTS'){ ui.send={state:'exists',msg:j.message}; }
    else ui.send={state:'error',msg:(j.message||'O script recusou o envio.')+(j.code?' ('+j.code+')':'')};
  }catch(e){ ui.send={state:'error',msg:/Google/.test(e.message)?e.message:'Sem conexão com o script. Os dados continuam salvos neste aparelho; tente de novo quando houver internet.'}; }
  render();
}
let gLoaded=false;
function initGoogle(){
  const c=lsGet(CFGK)||{}; const el=$('#gbtn'); if(!el||!c.clientId) return;
  const go=()=>{ try{ window.google.accounts.id.initialize({client_id:c.clientId,callback:r=>{ui.idToken=r.credential; const s=$('#gstat'); if(s) s.textContent='Conectado com Google.';}}); window.google.accounts.id.renderButton(el,{theme:'outline',size:'large',locale:'pt-BR'}); }catch(e){} };
  if(window.google&&window.google.accounts){go();return;}
  if(gLoaded) return; gLoaded=true;
  const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.async=true; s.onload=go; s.onerror=()=>{gLoaded=false; const g=$('#gstat'); if(g) g.textContent='Não foi possível carregar o login do Google neste ambiente.';}; document.head.appendChild(s);
}
async function testConn(){
  const cfg=readCfg(); const m=$('#cmsg'); if(!cfg.url){m.textContent='Informe o endereço do script.';return;}
  m.textContent='Testando…';
  try{ const pl={action:'ping'}; const tok=cfg.clientId?ui.idToken:null; if(tok) pl.idToken=tok; else pl.key=cfg.key||'';
    const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(pl)}); const j=await r.json();

    case 'tab': S.tab=d.t; save(); render(); window.scrollTo(0,0); break;
    case 'undo': doUndo(); break;
    case 'cfg': ui.sheet={type:'cfg'}; render(); break;
    case 'nt': { const n=+d.n; if(n<S.teams.length&&S.teams.slice(n).some(t=>t.players.length)){showToast('Tire os atletas dos times que sobram antes.');break;} commit(()=>{S.nt=n; if(n>S.teams.length){for(let i=S.teams.length;i<n;i++) S.teams.push({c:TEAMS[i].k,players:[]});} else S.teams=S.teams.slice(0,n);}); break; }
    case 'imp': { const t=parseSorteio($('#fImp').value); if(!t.length){showToast('Não encontrei times nesse texto.');break;} applyTeams(t); break; }
    case 'impls': { const o=lsGet(SORT); if(!o||!o.teams||!o.teams.length){showToast('Não há sorteio guardado neste aparelho.');break;} const gt={}; Object.keys(o.gkTeam||{}).forEach(k=>{gt[canon(k)]=o.gkTeam[k];}); applyTeams(o.teams.map(x=>({c:x.c,players:(x.players||[]).map(p=>({n:canon(p.n),zc:p.pos==='Z'})),gks:(x.gks||[]).map(canon)})),gt); break; }
    case 'prow': ui.row=ui.row===d.i+':'+d.j?null:d.i+':'+d.j; render(); break;
    case 'zc': commit(()=>{const p=S.teams[+d.i].players[+d.j]; p.zc=!p.zc;}); break;
    case 'mv': commit(()=>{const p=S.teams[+d.i].players.splice(+d.j,1)[0]; S.teams[+d.k].players.push(p); ui.row=null;}); break;
    case 'rm': { const p=S.teams[+d.i].players[+d.j]; if(liveGoalCount(p.n)||S.games.some(g=>g.goals.some(x=>x.as===p.n))){showToast('Esse atleta tem gols ou assistências lançados.');break;} commit(()=>{S.teams[+d.i].players.splice(+d.j,1); ui.row=null;}); break; }
    case 'pick': ui.sheet={type:'pick',t:d.t==='gk'||d.t==='abs'?d.t:+d.t}; ui.pickMsg=''; render(); setTimeout(()=>{const q=$('#pq'); if(q) q.focus();},60); break;
    case 'padd': addPick(d.n); break;
    case 'late': commit(()=>{const x=ex(d.n); x.assid=x.assid===1?2:1; S.extras[d.n]=x;}); break;
    case 'abs': { const p=S.teams[+d.i].players[+d.j]; if(liveGoalCount(p.n)||S.games.some(g=>g.goals.some(x=>x.as===p.n))){showToast('Esse atleta já tem gols ou assistências lançados.');break;} commit(()=>{S.teams[+d.i].players.splice(+d.j,1); S.absent.push(p.n); ui.row=null;}); break; }
    case 'absrm': commit(()=>{S.absent.splice(+d.j,1);}); break;
    case 'gkrm': { const k=S.gks[+d.j]; if(S.games.some(g=>g.gk[0]===k.n||g.gk[1]===k.n)){showToast('Esse goleiro já jogou hoje.');break;} commit(()=>{S.gks.splice(+d.j,1);}); break; }
    case 'start': if(S.games.length){S.tab='jogo';save();render();} else startDay(); break;
    case 'gsel': S.cur=+d.i; save(); render(); break;
    case 'gol': addGoal(+d.s); break;
    case 'gmin': removeLastGoal(+d.s); break;
    case 'evedit': { const g=S.games[S.cur]; const k=+d.k; ui.sheet={type:g.goals[k].by===null?'by':'as',gi:S.cur,k:k}; if(g.goals[k].by!==null&&g.goals[k].by!=='*') ui.sheet.type=g.goals[k].as===null?'as':'by'; if(g.goals[k].by==='*') ui.sheet.type='by'; render(); break; }
    case 'by': pickBy(d.n); break;
    case 'as': pickAs(d.n); break;
    case 'backby': ui.sheet.type='by'; render(); break;
    case 'later': closeSheet(); break;
    case 'close': closeSheet(); break;
    case 'fim': finishGame(); break;
    case 'noauthor': commit(()=>{const g=S.games[S.cur]; g.goals.forEach(x=>{if(x.by===null){x.by='*';x.as='';} else if(x.as===null) x.as='';}); ui.sheet=null; g.done=true; afterDone();}); break;
    case 'stayw': commit(()=>{const i=+d.i, g=S.games[0]; setOrder(i,i===g.a?g.b:g.a); ui.sheet=null; syncGames(); advance();}); break;
    case 'next': commit(()=>{advance();}); break;
    case 'reopen': reopen(S.cur); break;
    case 'gkpick': ui.sheet={type:'gk',s:+d.s}; render(); break;
    case 'gkset': commit(()=>{const g=S.games[S.cur]; const s=ui.sheet.s; g.gk[s]=d.n||null; if(d.n&&g.gk[1-s]===d.n) g.gk[1-s]=null; g.gkAuto=true; ui.sheet=null;}); break;
    case 'gkswap': commit(()=>{const g=S.games[S.cur]; g.gk=[g.gk[1],g.gk[0]]; g.gkAuto=true; ui.sheet=null;}); break;
    case 'pickgk': ui.sheet={type:'pick',t:'gk'}; render(); break;
    case 'gkteam': break;
    case 'pair': ui.sheet={type:'pair'}; render(); break;
    case 'pairok': { const A=+$('#pA').value,B=+$('#pB').value; if(A===B){showToast('Escolha dois times diferentes.');break;} commit(()=>{const g=S.games[S.cur]; g.a=A; g.b=B; g.gkAuto=false; if(S.cur===0&&S.teams.length===3) setOrder(A,B); ui.sheet=null;}); break; }
    case 'redraw': commit(()=>{const n=S.teams.length; const o=[...Array(n).keys()]; for(let i=o.length-1;i>0;i--){const j=rnd(i+1);[o[i],o[j]]=[o[j],o[i]];} S.order=o; const p=pairAt(0); const g=S.games[0]; g.a=p[0]; g.b=p[1]; g.gkAuto=false;}); break;
    case 'tot': commit(()=>{const done=S.games.filter(g=>g.done||g.goals.length).length; S.total=Math.max(done||1,Math.min(30,S.total+ +d.d));}); break;
    case 'adj': commit(()=>{const x=ex(d.n); x[d.f]=Math.max(0,x[d.f]+ +d.d); S.extras[d.n]=x;}); break;
    case 'send': send(false); break;
    case 'sendreplace': send(true); break;
    case 'sendcancel': ui.send=null; render(); break;
    case 'cp26': copyOut(tsv26(($('#r26')||{}).value),'Linhas da aba 2026','Cole na primeira linha livre da aba 2026.'); break;
    case 'cpJ': copyOut(tsvJ(($('#rJ')||{}).value),'Linhas da aba Jogos','Cole na primeira linha livre da aba Jogos.'); break;
    case 'cpBk': copyOut(JSON.stringify(S),'Backup do dia','Guarde este texto. Para restaurar, ele pode ser colado de volta pelo suporte.'); break;
    case 'cfgsave': lsSet(CFGK,readCfg()); $('#cmsg').textContent='Salvo.'; initGoogle(); break;
    case 'cfgtest': lsSet(CFGK,readCfg()); testConn(); break;
    case 'newday': ui.sheet={type:'newday'}; render(); break;
    case 'newdayok': S=fresh(); undo.length=0; ui.sheet=null; ui.send=null; save(); render(); break;
    case 'toastact': { const t=ui.toast; ui.toast=null; renderToast(); if(t&&t.act) t.act.fn(); break; }
  }
});
document.addEventListener('input',function(e){ if(e.target.id==='pq') fillPick(e.target.value); });
document.addEventListener('change',function(e){
  const t=e.target;
  if(t.id==='fDate'&&t.value){ commit(()=>{S.date=t.value;}); }
  if(t.dataset&&t.dataset.act==='gkteam'){ commit(()=>{S.gks[+t.dataset.j].t=t.value===''?null:+t.value;}); }
});
function closeSheet(){ui.sheet=null; render();}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&ui.sheet) closeSheet(); });
window.AM={get S(){return S;},set S(v){S=v;},compute,teamTable,buildPayload,parseSorteio,pending,score,tsv26,tsvJ,syncGames,pairAt,render,commit,setOrder,newGame};
if(S.games.length&&S.tab==='times'){}
render();
})();
</script>
